site_name: Pipeline Integrity Monitoring
site_description: ML system for pipeline integrity monitoring
repo_url: https://github.com/kcabrera-oil-gas/pipeline-integrity-monitoring
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.instant
    - navigation.top

nav:
  - Home: index.md
  - API: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
